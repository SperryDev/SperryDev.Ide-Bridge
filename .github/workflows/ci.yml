name: CI

on:
  push:
    branches: [wip, dev, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SperryDev.Ide-Bridge.slnx

      - name: Build
        run: dotnet build SperryDev.Ide-Bridge.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SperryDev.Ide-Bridge.slnx -c Release --no-build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/SperryDev.Ide.Bridge/SperryDev.Ide.Bridge.csproj -c Release \
            -o artifacts -p:Version="$VERSION"

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/SperryDev/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
